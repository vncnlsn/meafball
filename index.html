<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>Allstate Permit Services</title>
  <meta name="description" content="Allstate Permit Services is updating its website. Contact us at allstatepermit@allstatepermit.com or (303) 903-5873." />
  <style>
    :root{
      --bg:#f7f3ec;
      --card:#ffffff;
      --text:#223047;
      --muted:#667085;
      --accent:#b07b2f;
      --border:#e9ddcc;
      --shadow:0 18px 50px rgba(34,48,71,.08);
      --blue:#6f89bb;
      --red:#c57b7b;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(circle at top left, rgba(111,137,187,.08), transparent 24%),
        radial-gradient(circle at top right, rgba(197,123,123,.08), transparent 22%),
        linear-gradient(180deg, #fcfaf6 0%, var(--bg) 100%);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    .shell{
      width:100%;
      max-width:860px;
    }

    .card{
      background:rgba(255,255,255,.96);
      border:1px solid var(--border);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:clamp(32px,5vw,64px);
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:5px;
      background:linear-gradient(90deg, var(--blue) 0 34%, #efe7dc 34% 66%, var(--red) 66% 100%);
      opacity:.75;
    }

    .eyebrow{
      margin:4px 0 18px;
      color:var(--accent);
      text-transform:uppercase;
      letter-spacing:.24em;
      font-size:.78rem;
      font-weight:700;
    }

    h1{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      font-weight:500;
      color:var(--text);
      font-size:clamp(2.2rem,7vw,4.4rem);
      line-height:1.02;
      letter-spacing:-.03em;
    }

    .line{
      margin:22px auto 0;
      max-width:34rem;
      color:var(--muted);
      font-size:1.03rem;
      line-height:1.75;
    }

    .panel{
      margin:34px auto 0;
      max-width:520px;
      border:1px solid var(--border);
      border-radius:22px;
      background:#fff;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(34,48,71,.04);
    }

    .panel-head{
      padding:18px 18px 14px;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:.82rem;
      color:var(--accent);
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, #fff, #fffdf9);
    }

    .items{
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    .item{
      padding:24px 18px 26px;
    }

    .item + .item{
      border-left:1px solid var(--border);
    }

    .label{
      display:block;
      margin-bottom:10px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:.76rem;
    }

    .value{
      color:var(--text);
      text-decoration:none;
      font-size:1.05rem;
      font-weight:700;
      line-height:1.4;
      word-break:break-word;
    }

    .value:hover{text-decoration:underline}

    .footer{
      margin-top:28px;
      color:var(--muted);
      font-size:.92rem;
      line-height:1.6;
    }

    @media (max-width:700px){
      body{padding:14px}
      .card{border-radius:22px;padding:28px 16px 30px}
      h1{font-size:clamp(2rem,10vw,3.2rem)}
      .line{font-size:.99rem;margin-top:18px}
      .panel{margin-top:28px}
      .items{grid-template-columns:1fr}
      .item + .item{border-left:none;border-top:1px solid var(--border)}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Website update notice">
      <div class="eyebrow">Allstate Permit Services</div>
      <h1>Our website is being updated.</h1>

      <p class="line">
        Permitting and land services for utility, energy, and infrastructure projects nationwide.
      </p>

      <div class="panel">
        <div class="panel-head">Contact</div>
        <div class="items">
          <div class="item">
            <span class="label">Phone</span>
            <a class="value" href="tel:+13039035873">(303) 903-5873</a>
          </div>
          <div class="item">
            <span class="label">Email</span>
            <a class="value" href="mailto:allstatepermit@allstatepermit.com">allstatepermit@allstatepermit.com</a>
          </div>
        </div>
      </div>

      <div class="footer">
        We are updating the site and will be back soon.
      </div>
    </section>
  </main>
</body>
</html>
