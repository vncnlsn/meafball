<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allstate Permit Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #1B2A4A;
      --cream: #F5F3EE;
      --brass: #A87C3E;
      --red:   #8B2635;
      --mist:  #8A96A8;
    }

    html, body { height: 100%; }

    body {
      background: var(--cream);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    /* ── Main content — vertically and horizontally centered ── */
    main {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 72px;
      max-width: 860px;
      width: 100%;
    }

    /* ── Top mark ── */
    .mark {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 64px;
    }

    /* Three-stripe tricolor — 1px each, stacked, 40px wide */
    .tricolor {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 36px;
    }
    .tricolor span {
      display: block;
      height: 1.5px;
      width: 100%;
    }
    .tricolor span:nth-child(1) { background: var(--navy); }
    .tricolor span:nth-child(2) { background: #B0BACA; }
    .tricolor span:nth-child(3) { background: var(--red); }

    .wordmark {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
    }

    /* ── Headline ── */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px, 7.5vw, 80px);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--navy);
      margin-bottom: 28px;
      max-width: 720px;
    }
    h1 em {
      font-style: italic;
    }

    /* ── Descriptor — single line, no more ── */
    .descriptor {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--mist);
      letter-spacing: 0.01em;
      margin-bottom: 72px;
    }

    /* ── Contact ── */
    .contact {
      display: flex;
      align-items: flex-start;
      gap: 56px;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .contact-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
    }

    .contact-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--navy);
      text-decoration: none;
      transition: color 0.18s;
    }
    .contact-value:hover { color: var(--brass); }

    /* ── Footer ── */
    footer {
      padding: 24px 72px;
      border-top: 1px solid #DDDAD2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left {
      font-size: 11px;
      font-weight: 300;
      color: #A8A099;
      letter-spacing: 0.04em;
    }

    .footer-right {
      font-size: 11px;
      font-weight: 300;
      color: #A8A099;
      letter-spacing: 0.04em;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      main { padding: 48px 32px; }
      footer { padding: 20px 32px; flex-direction: column; gap: 6px; align-items: flex-start; }
      .contact { flex-direction: column; gap: 32px; }
    }
  </style>
</head>
<body>

  <main>
    <div class="mark">
      <div class="tricolor" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <span class="wordmark">Allstate Permit Services</span>
    </div>

    <h1>Our new website<br>is <em>on the way.</em></h1>

    <p class="descriptor">Permitting &amp; land services for pipeline, seismic, and infrastructure projects nationwide.</p>

    <div class="contact">
      <div class="contact-item">
        <span class="contact-label">Phone</span>
        <a class="contact-value" href="tel:+13039035873">(303) 903-5873</a>
      </div>
      <div class="contact-item">
        <span class="contact-label">Email</span>
        <a class="contact-value" href="mailto:allstatepermit@allstatepermit.com">allstatepermit@allstatepermit.com</a>
      </div>
    </div>
  </main>

  <footer>
    <span class="footer-left">Est. 1980</span>
    <span class="footer-right">allstatepermit.com</span>
  </footer>

</body>
</html>
